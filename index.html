<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Været for Agder avdelingen</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div class="max-w-7xl mx-auto p-4 md:p-8">
    <header class="flex flex-col md:flex-row items-start md:items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <img src="mve-mobil-color.svg" alt="MVE logo" class="h-10 w-auto" />
        <div class="flex flex-col gap-1">
          <h1 class="text-2xl md:text-3xl font-semibold">Været for Agder avdelingen</h1>
          <div class="flex items-center gap-2 text-sm text-slate-700">
            <label for="daySelect">Dag:</label>
            <select id="daySelect" class="rounded-lg border border-slate-300 px-2 py-1">
              <option value="0">I dag</option>
              <option value="1">I morgen</option>
              <option value="2">Om 2 dager</option>
            </select>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button id="useGeoBtn" class="px-4 py-2 rounded-2xl bg-slate-800 text-white shadow hover:bg-slate-900">Bruk min posisjon</button>
        <button id="refreshBtn" class="px-4 py-2 rounded-2xl border border-slate-300 bg-white hover:bg-slate-100">Oppdater</button>
        <button id="settingsBtn" class="px-4 py-2 rounded-2xl border border-slate-300 bg-white hover:bg-slate-100">Innstillinger</button>
      </div>
    </header>

    <p class="mt-2 text-sm text-slate-600">Viser temperatur (°C), nedbør (mm) og vind (m/s) fra <strong>07:00 til 14:00</strong> (Europa/Oslo).</p>

    <div id="alert" class="hidden mt-3 p-3 rounded-xl bg-amber-50 border border-amber-200 text-amber-900"></div>
    <section id="cards" class="mt-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></section>

    <footer class="mt-10 text-xs text-slate-500">Data fra MET Norway / api.met.no • Kart © OpenStreetMap-bidragsytere</footer>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
